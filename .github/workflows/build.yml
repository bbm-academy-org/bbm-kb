# CI: проверка, что статический экспорт Fumadocs собирается,
# + guard «правки только через PR» (компенсация отсутствия branch protection
# на приватном репо бесплатной орги — включим protection при переходе на Team),
# + деплой на kb.bbm.academy при push в main (BBMP-100): артефакт билда
# доставляется rsync'ом на tools-prod-tw в /var/www/kb.bbm.academy, где его
# раздаёт host-nginx за OIDC (oauth2-proxy → Zitadel BBM; конфиги — repo bbm,
# infra/kb/). Секреты KB_DEPLOY_* — GitHub Actions secrets; SSH-ключ ограничен
# на хосте rrsync'ом только каталогом статики (authorized_keys, command=rrsync).
name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (static export)
        run: npm run build

      # Артефакт билда — для ручной проверки/будущего деплоя
      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: kb-static-export
          path: out/
          retention-days: 7

  # Guard: прямой пуш в main мимо PR → красный job.
  # Проверяется только HEAD-коммит текущего пуша; коммиты с маркером
  # [bootstrap] в сообщении пропускаются (bootstrap-фаза репо).
  pr-guard:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Коммит пришёл через merged PR?
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          MSG=$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.message')
          if printf '%s' "$MSG" | grep -qF '[bootstrap]'; then
            echo "Маркер [bootstrap] в сообщении коммита — guard пропущен."
            exit 0
          fi
          MERGED=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq '[.[] | select(.merged_at != null)] | length')
          if [ "$MERGED" -eq 0 ]; then
            echo "::error::Коммит $SHA попал в main прямым пушем, мимо PR. Правки — только через pull request (см. README/AGENTS). Локальная защита: git config core.hooksPath .githooks"
            exit 1
          fi
          echo "OK: коммит ассоциирован с merged PR."

  # Деплой статики на kb.bbm.academy (BBMP-100). Только после merge в main.
  # Артефакт берём из job build этого же run — билд не повторяется.
  # rsync --delete: /var/www/kb.bbm.academy зеркалит out/ (ключ на хосте
  # заперт rrsync'ом в этом каталоге, ничего другого ключ сделать не может).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency: kb-deploy   # деплои строго по одному, без гонок rsync
    steps:
      - name: Download static export
        uses: actions/download-artifact@v4
        with:
          name: kb-static-export
          path: out

      - name: Настроить SSH
        env:
          SSH_KEY: ${{ secrets.KB_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KB_DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Rsync на tools-prod-tw
        env:
          HOST: ${{ secrets.KB_DEPLOY_HOST }}
        run: |
          # rrsync на хосте маппит "/" в /var/www/kb.bbm.academy
          rsync -az --delete out/ "deploy@${HOST}:/"
          echo "Deployed to kb.bbm.academy"
