# CI: проверка, что статический экспорт Fumadocs собирается.
# Секретов не требует. Деплой на kb.bbm.academy — отдельная задача (спека §6).
name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (static export)
        run: npm run build

      # Артефакт билда — для ручной проверки/будущего деплоя
      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: kb-static-export
          path: out/
          retention-days: 7
