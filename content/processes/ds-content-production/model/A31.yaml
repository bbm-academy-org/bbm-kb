boxes:
  - id: A311
    name: Подготовить материал эксперта
    functions: [F-027, F-028, F-029, F-068, F-037, F-030, F-031]
    mechanisms:
      - Менеджер эксперта
      - Пул экспертов — эксперт
      - Медредактор-сценарист
    note: >-
      Шаги 1–4 — бриф, клинический случай, формат DS, приём и разметка материала, темы. Принятый
      материал по темам (a01) — точка развилки: от него параллельно идут сценарий A312, тесты и
      брошюра A315 и микролернинги A317; тема урока и клинический случай уходят на подготовку анонса
      (выход O2 → A4).
  - id: A312
    name: Написать сценарий
    functions: [F-032, F-033, F-034, F-038, F-052, F-036, F-039, F-040]
    mechanisms: [Медредактор-сценарист]
    note: >-
      Шаги 5–7 и 12: план урока и ИИ-шаблоны, сценарий с МНН, рекламный текст на уровне сценария
      (спонсорский и брендированный контент), доработка до «зелёного» по замечаниям рецензента и
      фармы, декомпозиция на элементы и разметка видов визуализации (снимает TK-1).
    leaf: true
    effort:
      role: Медредактор-сценарист
      unit: урок
      hours_draft: [16, 28]
      lead_days_draft: [4, 8]
      lead_days_basis: "оценка аналитика; опора: сценарий — «довольно много дней» (L2613)"
      driver: длительность ролика; доля брендированных уроков
      iterations: итерации сценария до «зелёного»
      basis: "оценка аналитика; опора: урок ≈ 45 мин (M:2026-08-28-0958), сценарий — «довольно много дней» (L2613)"
  - id: A313
    name: Проверить и согласовать сценарий
    functions: [F-035, F-053, F-057, F-058, F-059, F-050]
    mechanisms:
      - Пул медрецензентов
      - Сервисный круг — юрист
      - Менеджер эксперта
      - Аккаунт
      - Продуктовая команда
      - Продюсер
    note: >-
      Шаги 8–11: медрецензия с вето на достоверность (В4), юрпроверка рекламы, апрув эксперта,
      этап 1 фармы — аккаунт окно к фарме, продуктовая команда подключается по содержанию по
      необходимости; маршрут согласования по чек-листу ведёт продюсер (A3135).
  - id: A314
    name: Произвести медиа
    functions: [F-051, F-041, F-042, F-043, F-044, F-047]
    mechanisms: [Медиа-круг]
    note: >-
      Шаги 13–14 по решению В3 — ролик урока: медиа-ведущий ротируется в команду (раскадровка),
      анимация, голос и монтаж идут потоком в медиа-круге; пики — внешний пул по стандарту DS.
      Микролернинги и нарезка записей мероприятий — отдельный поток A317.
  - id: A315
    name: Составить тесты и брошюру
    functions: [F-045, F-046]
    mechanisms: [Медредактор-сценарист]
    note: >-
      Шаг 15 — исполнитель медредактор-сценарист: тесты обязательны, по стандарту теста; брошюра для
      скачивания. Вход — принятый материал эксперта и программа, а не одобренный сценарий: тесты и
      брошюра идут параллельно сценарию и медиа и проходят медпроверку в A3161 (решение 2026-11-17).
    leaf: true
    effort:
      role: Медредактор-сценарист
      unit: урок
      hours_draft: [4, 8]
      lead_days_draft: [1, 2]
      lead_days_basis: "оценка аналитика; идёт параллельно сценарию и медиа (A312–A314), от принятого материала A311"
      driver: число вопросов теста; объём материала для скачивания
      basis: "оценка аналитика; опора: урок = 4 компонента + тесты (M:2026-09-08-0952)"
  - id: A316
    name: Собрать, принять и одобрить урок
    functions: [F-056, F-054, F-055, F-067, F-060]
    mechanisms:
      - Пул медрецензентов
      - Продюсер
      - Аккаунт
      - Продуктовая команда
    note: >-
      Шаги 16–18 — медпроверка ролика, микролернингов, тестов и брошюры, приёмка по чек-листу, этап 2
      фармы и номер одобрения; маршрут приёмки и этапа 2 ведёт продюсер (A3164); аккаунт — окно к
      фарме, продуктовая команда подключается по содержанию по необходимости.
  - id: A317
    name: Произвести микролернинги
    functions: [F-048]
    mechanisms:
      - Медредактор-сценарист
      - Медиа-круг — монтажёр
    note: >-
      Новое (2026-11-17): микролернинги — отдельный поток из клинического случая и программы, а не
      монтаж вместе с роликом; стартует от принятого материала A311 параллельно сценарию. Сюда же —
      нарезка записей мероприятий на микролернинги (F-048, обратная связь A0 a04). Медпроверка — в
      A3161, раз микролернинги не проходят медрецензию сценария.
