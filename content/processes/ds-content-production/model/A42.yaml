  - id: A422
    name: Дать заключение по затронутой единице
    functions: []
    mechanisms: [Пул медрецензентов]
    note: >-
      Шаг 7, часть рецензента (в реестре отдельным шагом нет): пул рецензентов — по сигналу; решение
      «обновить / снять» команда принимает после заключения.
    leaf: true
    effort:
      role: Пул медрецензентов
      unit: затронутая единица
      hours_draft: [0.5, 1.5]
      lead_days_draft: [2, 5]
      lead_days_basis: "оценка аналитика"
      driver: число затронутых единиц на сигнал; глубина расхождения с рекомендацией
      basis: оценка аналитика
  - id: A423
    name: Решить и запустить актуализацию
    functions: [F-097, F-098, F-099]
    mechanisms: [Продюсер]
    note: >-
      Шаг 7: команда-владелец решает обновить урок или сделать подкаст обновления (задание уходит в
      линии A31 / A32 — там часы пересборки) либо промаркировать или снять урок (исполняет публикация
      A412); срочное снятие при отзыве препарата — директивно по закону. Резерв актуализации —
      параметр на срок договора (решение В6).
    leaf: true
    effort:
      role: Продюсер
      unit: затронутая единица
      hours_draft: [0.5, 1]
      lead_days_draft: [1, 2]
      lead_days_basis: "оценка аналитика"
      driver: доля уроков, требующих обновления; глубина (подкаст обновления или пересборка)
      basis: оценка аналитика
  - id: A424
    name: Сменить рекламное место
    functions: []
    mechanisms: [Медиа-круг — монтажёр]
    note: >-
      Новое (#3068, шаг 8 блока 5): триггеры — начало срока размещения, конец срока (место
      возвращается к нейтральному варианту DS), достигнут лимит партнёра, следующий партнёр из
      очереди. Бриф места → перегенерация эпизода по разметке монтажного листа (A3147) → рендер →
      загрузка через публикацию (A412) → отметка смены в отчёте партнёру. Новая версия действует для
      просмотров после смены. Затрата DS: партнёру не выставляется и наценки не несёт; часы на смену
      зависят от категории места (справочник мест калькулятора).
    leaf: true
    effort:
      role: Медиа-круг — монтажёр
      unit: смена места
      hours_draft: [1, 12]
      lead_days_draft: [1, 3]
      lead_days_basis: "оценка аналитика"
      driver: категория места (фон и крупный план — мало, сюжетная ветка — перегенерация); смен за срок (2)
      basis: "оценка аналитика; решение владельца 2026-10-20 (#3068, п. 4)"
