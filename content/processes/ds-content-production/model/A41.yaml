      договора. Расширенная кампания — отдельная опция пакета (A414).
    leaf: true
    effort:
      role: Медиа-круг — анонсы
      unit: урок
      hours_draft: [2, 4]
      lead_days_draft: 5
      lead_days_basis: "оценка аналитика; опора: тизер за неделю до релиза (L1843)"
      driver: число анонсов на урок (тизер, рилсы, календарь); каналы партнёра; доля анонсов с препаратом (маршрут одобрения)
