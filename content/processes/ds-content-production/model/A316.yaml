boxes:
  - id: A3161
    name: Проверить монтаж, микролернинги, тесты и медсоответствие
    functions: [F-056, F-054]
    mechanisms: [Пул медрецензентов]
    note: >-
      Шаг 16: ролик — выборочная проверка расхождений со сценарием при совпадении сценария и
      раскадровки, полная — для брендированных (реко Р3.3). Тесты, брошюра и микролернинги делаются
      параллельно сценарию от принятого материала и медрецензию сценария не проходят, поэтому их
      медсоответствие рецензент проверяет здесь полностью (решение 2026-11-17); замечания — на
      доработку в A315 и A317.
    leaf: true
    effort:
      role: Пул медрецензентов
      unit: урок
      hours_draft: [2, 5]
      lead_days_draft: [1, 3]
      lead_days_basis: "оценка аналитика"
      driver: доля брендированных уроков (полная проверка ролика); число микролернингов и вопросов теста
      basis: оценка аналитика
  - id: A3162
    name: Собрать состав и принять урок
    functions: [F-055, F-067]
    mechanisms: [Продюсер]
    note: >-
      Шаг 17: приёмка по чек-листу без «вкусового» вето, урок не выводится без состава (O-169);
      очередь по исполнителям и сроки (F-067) — сквозная работа продюсера по линии.
    leaf: true
    effort:
      role: Продюсер
      unit: урок
      hours_draft: [2, 4]
      lead_days_draft: [1, 2]
      lead_days_basis: "оценка аналитика; опора: ритм 1 урок в неделю на направление (L1661)"
      driver: число параллельных уроков в очереди
      basis: "оценка аналитика; опора: ритм 1 урок в неделю на направление (L1661)"
  - id: A3163
    name: Пройти этап 2 одобрения фармы
    functions: [F-060]
    mechanisms: [Аккаунт, Продуктовая команда]
    note: >-
      Шаг 18: аккаунт — окно к фарме, по содержанию подключается продуктовая команда по
      необходимости; финальный ролик, номер одобрения; при поздней рекламе переделываются только рекламные
      кадры; при гранте шаг пропускается.
    leaf: true
    effort:
      role: Аккаунт
      unit: урок
      hours_draft: [0.5, 2]
      lead_days_draft: [2, 5]
      lead_days_basis: "оценка аналитика; опора: согласование у фармы «днями и неделями» (L1661)"
      driver: доля спонсорских уроков; максимум кругов и срок автоодобрения из договора
      iterations: круги этапа 2 фармы
      basis: "оценка аналитика; опора: 2 этапа одобрения фармы (L1629-1673)"
  - id: A3164
    name: Вести маршрут приёмки и этапа 2 по чек-листу
    functions: []
    mechanisms: [Продюсер]
    note: >-
      Новое (2026-11-17): отдельная операция, а не расширение приёмки A3162 — у приёмки свой
      результат (принятый урок), у маршрута — сквозная координация: разослать ролик, микролернинги,
      тесты и брошюру на медпроверку, передать аккаунту на этап 2 фармы, собрать ответы и дожать по
      срокам. Большая часть — «отправить и ждать»: часов мало, срок прохода идёт параллельно самим
      проверкам A3161–A3163; повторные круги правок — внутри диапазона часов.
    leaf: true
    effort:
      role: Продюсер
      unit: урок
      hours_draft: [0.5, 1.5]
      lead_days_draft: [3, 6]
      lead_days_basis: "оценка аналитика; ожидание ответов внутри прохода, параллельно A3161–A3163"
      driver: число компонентов на проверке; доля спонсорских уроков (этап 2 фармы в маршруте)
      basis: "оценка аналитика; встреча 2026-11-17 (M:2026-11-17-0959): координация — «написать одно сообщение и ждать ответ»"
