  I1: a03
  I2: I4
  I3: a19
  C1: C1
  C2: C2
  C3: a01
  C4: a13
  O1: a05
  O2: a05
  O3: a05
  O4: a07
  M1: M1
  M2: M1
  M3: M3
  M4: M4
  M5: M5
  M6: M7
  M7: a14
  M8: M4
boxes:
  - id: A41
    name: Выпустить и продвигать
    functions: [F-064, F-069, F-070, F-071]
    mechanisms:
      - Медредактор-сценарист
      - Сервисный круг — оператор платформы
      - Медиа-круг — анонсы
    note: >-
      Шаги 1–4: маркировка и теги, публикация по очереди выпуска, базовый анонс, расширенная кампания
      — раскрыто диаграммой A41. Отдельный блок, потому что работу запускает дата релиза и её делают
      выпускающие роли (медредактор, оператор платформы, анонсы медиа-круга) — раз на каждую
      единицу, к выходу. Публикация исполняет и решения сопровождения A42.
  - id: A42
    name: Сопровождать выпущенное
    functions: [F-095, F-096, F-097, F-098, F-099]
    mechanisms:
      - Продюсер
      - Пул медрецензентов
      - Медиа-круг — монтажёр
    note: >-
      Шаги 5–8: приём сигнала и поиск затронутых единиц, заключение рецензента, решение и запуск
      актуализации, смена рекламного места — раскрыто диаграммой A42. Отдельный блок, потому что
      работу запускает не дата релиза, а внешний сигнал (отзыв препарата, новая рекомендация, peer
      review) или смена партнёра на рекламном месте в течение срока договора, и делают её другие
      роли — продюсер команды-владельца, рецензент по сигналу, монтажёр.
