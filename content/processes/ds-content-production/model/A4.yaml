# IDEF0 decomposition A4 «Выпустить и сопровождать» (child of A0; format: FORMAT-ru.md).
# Steps 1–8 of process block 5 (../process-to-be-ru.md) in two blocks that differ by who works and
# what starts the work: A41 releases and promotes by the release date, A42 accompanies released units
# on an external signal or a partner change. Leaves sit in A41.yaml and A42.yaml.
id: A4
parent: A0
title: Выпустить и сопровождать
# Child boundary code → A0 arrow touching box A4 on that side.
